name: Auto-tag release

# Turns "the add-on version increased on main" into a published GitHub Release
# with no manual step. When a push to main changes claude-terminal/config.yaml,
# this reads the version and, if no matching vX.Y.Z tag exists yet, creates an
# annotated tag and pushes it. That tag push triggers release.yml, which extracts
# the CHANGELOG section and publishes the Release. So merging any version-bumping
# PR — a weekly Claude bump, a feature release — is all it takes to ship a Release,
# and the GitHub "latest" can never drift from what the HA store actually shipped.
#
# Why BUMP_PAT and not the built-in token: a tag pushed with the default
# GITHUB_TOKEN does NOT trigger other workflows (GitHub's anti-recursion guard),
# so release.yml would never fire. Pushing as a user PAT makes it a "real" push.
# This is the same BUMP_PAT the Claude bump workflow already uses so its PRs run
# CI. We fail loudly if it is missing rather than fall back to the default token,
# because a silent fallback would push a tag that publishes nothing — recreating
# exactly the drift this workflow exists to remove.
#
# Why this job does not stop at "tag pushed": pushing the tag is the *means*, the
# published Release is the *outcome*, and v5.0.4 proved they can come apart. There,
# `git push` was rejected with "cannot lock ref: reference already exists" even
# though the ref had in fact been created — so the job failed, a re-run saw the tag
# and reported a green "nothing to do", and release.yml never fired because GitHub
# had registered no tag-push event. Green workflow, tag on the remote, no Release.
# Two guards below close that loop: the push failure is re-checked against the
# remote instead of trusted, and the job does not finish until a Release for the
# tag actually exists — publishing it here if the trigger never fired.
on:
  push:
    branches:
      - main
    paths:
      - claude-terminal/config.yaml

# Push the tag, and publish the Release if the fallback below has to step in.
permissions:
  contents: write

# Never let two pushes race to create the same tag.
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require BUMP_PAT
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          if [ -z "$BUMP_PAT" ]; then
            echo "::error::BUMP_PAT is not set. A tag pushed with the default GITHUB_TOKEN will not trigger release.yml, so the Release would never publish. Add a fine-grained PAT (Contents: Read/Write) as the repo secret BUMP_PAT."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Push the tag authenticated as the PAT so the tag-push triggers
          # release.yml. Full history + tags so the existence check below sees
          # every tag and the annotated tag points at the real commit.
          token: ${{ secrets.BUMP_PAT }}
          fetch-depth: 0
          fetch-tags: true

      - name: Read the add-on version
        id: version
        run: |
          version=$(grep -oP '^version:\s*"\K[^"]+' claude-terminal/config.yaml)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from claude-terminal/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Tag the version if not already tagged
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The remote is the authority on whether the tag exists — a local ref
          # could be stale, and it is the remote ref that release.yml keys on.
          remote_sha=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          head_sha=$(git rev-parse HEAD)

          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" = "$head_sha" ]; then
              # Idempotent: a non-version edit to config.yaml, or a workflow
              # re-run. Fall through — the Release check below still runs, which
              # is what repairs a tag that exists without a Release.
              echo "Tag ${TAG} already on origin at ${head_sha} — nothing to tag."
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on origin but points at ${remote_sha}, not this commit (${head_sha}). Refusing to move a published tag — resolve by hand."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"

          # Do not trust the push's exit status alone. A push can be reported as
          # rejected ("reference already exists") after the ref was in fact
          # created server-side; failing here would leave a tag on the remote and
          # a red workflow, with nobody publishing the Release. Re-check the
          # remote and only fail if the tag is genuinely absent or wrong.
          if git push origin "${TAG}"; then
            echo "Created and pushed ${TAG} — release.yml should publish the Release."
          else
            pushed_sha=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
            if [ "$pushed_sha" = "$head_sha" ]; then
              echo "::warning::git push reported a failure, but ${TAG} is on origin at the right commit. Continuing — the Release check below is what actually matters, and it will publish if the tag push did not trigger release.yml."
            else
              echo "::error::Failed to push ${TAG} (origin has '${pushed_sha:-nothing}', expected ${head_sha})."
              exit 1
            fi
          fi

      # The outcome that matters. Normally release.yml has already fired on the
      # tag push and this just confirms it within a few seconds. If the trigger
      # never fired, publish the Release here from the same CHANGELOG section, so
      # "merge the version bump" always ends in a published Release.
      - name: Verify the Release published — publish it if not
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for _ in $(seq 1 12); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG is published."
              exit 0
            fi
            sleep 10
          done

          echo "::warning::No Release for $TAG after 120s — release.yml did not fire for this tag. Publishing it here."
          notes=$(.github/scripts/release-notes.sh "$VERSION")
          if gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$notes"; then
            echo "Published Release $TAG from the fallback."
          # A late release.yml run can win the race between the poll above and
          # this create; that is success, not failure.
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG appeared while publishing — release.yml won the race."
          else
            echo "::error::Could not publish Release $TAG. The tag exists but no Release does — publish it by running the Release workflow manually with tag=$TAG."
            exit 1
          fi
